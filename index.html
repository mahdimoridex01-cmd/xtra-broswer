<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Xtra Browser</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --primary-light: #e8f0fe;
      --bg-bar: #0d47a1;
      --bg-toolbar: #ffffff;
      --bg-tab: #1565c0;
      --bg-tab-active: #ffffff;
      --text-main: #202124;
      --text-muted: #5f6368;
      --border: #dadce0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #f1f3f4;
      color: var(--text-main);
    }

    /* شريط التبويبات العلوي الأزرق */
    .tabs-bar {
      display: flex;
      align-items: center;
      background: var(--bg-bar);
      padding: 6px 8px 0 8px;
      gap: 4px;
      height: 38px;
      user-select: none;
    }

    .brand-badge {
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      padding: 0 10px 4px 6px;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      background: #64b5f6;
      border-radius: 50%;
    }

    #tabs-container {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      overflow-x: auto;
      height: 100%;
    }

    #tabs-container::-webkit-scrollbar {
      display: none;
    }

    .tab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-tab);
      color: #e3f2fd;
      padding: 0 10px;
      height: 32px;
      min-width: 130px;
      max-width: 210px;
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
      gap: 6px;
    }

    .tab:hover {
      background: #1976d2;
    }

    .tab.active {
      background: var(--bg-tab-active);
      color: var(--primary-dark);
      font-weight: 600;
    }

    .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .tab-close {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: inherit;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-close:hover {
      background: rgba(0, 0, 0, 0.12);
    }

    .new-tab-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .new-tab-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* شريط الأدوات والعنوان */
    .toolbar {
      display: flex;
      align-items: center;
      background: var(--bg-toolbar);
      padding: 6px 10px;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      direction: ltr;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .nav-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .omnibox-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: #f1f3f4;
      border: 1.5px solid transparent;
      border-radius: 20px;
      padding: 0 12px;
      height: 34px;
      transition: all 0.15s;
    }

    .omnibox-wrapper:focus-within {
      background: #ffffff;
      border-color: var(--primary);
    }

    #url-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 13.5px;
      color: var(--text-main);
    }

    .bookmark-star {
      border: none;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      color: var(--text-muted);
      padding-left: 6px;
    }

    .bookmark-star.saved {
      color: var(--primary);
    }

    /* شريط المفضلة */
    .bookmarks-bar {
      display: flex;
      align-items: center;
      background: #f8fafd;
      padding: 4px 12px;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      min-height: 28px;
      overflow-x: auto;
      direction: ltr;
    }

    .bookmarks-bar.hidden {
      display: none;
    }

    .bookmark-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2px 10px;
      font-size: 12px;
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
    }

    .bookmark-chip:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* منطقة العرض */
    #viewport {
      position: relative;
      flex: 1;
      background: #ffffff;
    }

    webview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    webview.active {
      display: flex;
    }

    /* صفحة البداية الجديدة */
    .start-page {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #f4f8fe 0%, #ffffff 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 5;
    }

    .start-page.active {
      display: flex;
    }

    .logo-title {
      font-size: 42px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .logo-title span {
      color: #0d47a1;
    }

    .logo-sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 26px;
    }

    .start-search-box {
      display: flex;
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border: 1.5px solid #cfd8dc;
      border-radius: 26px;
      padding: 6px 16px;
      box-shadow: 0 2px 8px rgba(26, 115, 232, 0.08);
      direction: ltr;
    }

    .start-search-box:focus-within {
      border-color: var(--primary);
    }

    .start-search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      padding: 6px;
    }

    .start-search-box button {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .start-search-box button:hover {
      background: var(--primary-dark);
    }

    /* لوحة السجل الجانبية */
    .side-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 320px;
      height: 100%;
      background: #ffffff;
      border-left: 1px solid var(--border);
      box-shadow: -2px 0 12px rgba(0, 0, 0, 0.08);
      z-index: 20;
      display: none;
      flex-direction: column;
      padding: 14px;
    }

    .side-panel.open {
      display: flex;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
      color: var(--primary-dark);
      font-weight: 700;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #f1f3f4;
      cursor: pointer;
      font-size: 12.5px;
      direction: ltr;
    }

    .history-item:hover {
      background: var(--primary-light);
    }

    .history-url {
      color: var(--text-muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- شريط التبويبات -->
  <div class="tabs-bar">
    <div class="brand-badge">
      <div class="brand-dot"></div>
      Xtra Browser
    </div>
    <div id="tabs-container"></div>
    <button class="new-tab-btn" id="add-tab-btn" title="تبويب جديد">+</button>
  </div>

  <!-- شريط الأدوات -->
  <div class="toolbar">
    <button class="nav-btn" id="btn-back" title="رجوع">&#8592;</button>
    <button class="nav-btn" id="btn-forward" title="تقدم">&#8594;</button>
    <button class="nav-btn" id="btn-reload" title="تحديث">&#8635;</button>
    <button class="nav-btn" id="btn-home" title="الرئيسية">&#8962;</button>

    <div class="omnibox-wrapper">
      <input type="text" id="url-input" placeholder="ابحث في جوجل أو أدخل رابط الموقع..." />
      <button class="bookmark-star" id="btn-star" title="إضافة للمفضلة">&#9734;</button>
    </div>

    <button class="nav-btn" id="btn-toggle-bookmarks" title="شريط المفضلة">&#9733;</button>
    <button class="nav-btn" id="btn-history" title="سجل التصفح">&#128337;</button>
  </div>

  <!-- شريط المفضلة -->
  <div class="bookmarks-bar" id="bookmarks-bar"></div>

  <!-- منطقة عرض الصفحات -->
  <div id="viewport">
    <div class="start-page active" id="start-page">
      <div class="logo-title">Xtra <span>Browser</span></div>
      <div class="logo-sub">تصفح سريع، نظيف، ومستقل بالكامل</div>
      <form class="start-search-box" id="start-search-form">
        <input type="text" id="start-search-input" placeholder="ابحث في الويب أو اكتب عنوان URL..." />
        <button type="submit">بحث</button>
      </form>
    </div>

    <!-- لوحة السجل -->
    <div class="side-panel" id="history-panel">
      <div class="panel-header">
        <span>سجل التصفح</span>
        <div>
          <button id="btn-clear-history" style="border:none;background:none;color:#d93025;cursor:pointer;font-size:12px;margin-left:8px;">مسح الكل</button>
          <button id="btn-close-history" style="border:none;background:none;font-size:16px;cursor:pointer;">&times;</button>
        </div>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <script>
    const tabsContainer = document.getElementById('tabs-container');
    const viewport = document.getElementById('viewport');
    const startPage = document.getElementById('start-page');
    const urlInput = document.getElementById('url-input');
    const btnStar = document.getElementById('btn-star');
    const bookmarksBar = document.getElementById('bookmarks-bar');
    const historyPanel = document.getElementById('history-panel');
    const historyList = document.getElementById('history-list');

    let tabs = [];
    let activeTabId = null;
    let bookmarks = JSON.parse(localStorage.getItem('xtra_bookmarks') || '[]');
    let historyItems = JSON.parse(localStorage.getItem('xtra_history') || '[]');

    function formatUrl(input) {
      const trimmed = input.trim();
      if (!trimmed) return '';
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      if (/^[\w-]+(\.[\w-]+)+/.test(trimmed) && !trimmed.includes(' ')) {
        return 'https://' + trimmed;
      }
      return 'https://www.google.com/search?q=' + encodeURIComponent(trimmed);
    }

    function createTab(initialUrl = '') {
      const id = 'tab-' + Date.now() + Math.random().toString(36).slice(2, 6);
      const webview = document.createElement('webview');
      webview.id = 'wv-' + id;
      webview.setAttribute('allowpopups', '');
      viewport.appendChild(webview);

      const tabObj = {
        id,
        title: 'تبويب جديد',
        url: initialUrl,
        webview
      };

      webview.addEventListener('page-title-updated', (e) => {
        tabObj.title = e.title || tabObj.url;
        renderTabs();
      });

      webview.addEventListener('did-navigate', (e) => {
        tabObj.url = e.url;
        if (activeTabId === id) {
          urlInput.value = e.url;
          updateStarState();
        }
        addToHistory(tabObj.title, e.url);
        renderTabs();
      });

      webview.addEventListener('did-navigate-in-page', (e) => {
        if (e.isMainFrame) {
          tabObj.url = e.url;
          if (activeTabId === id) {
            urlInput.value = e.url;
            updateStarState();
          }
        }
      });

      tabs.push(tabObj);
      switchTab(id);

      if (initialUrl) {
        navigateActiveTab(initialUrl);
      }
    }

    function switchTab(id) {
      activeTabId = id;
      const current = tabs.find(t => t.id === id);
      if (!current) return;

      tabs.forEach(t => {
        t.webview.classList.toggle('active', t.id === id && Boolean(t.url));
      });

      if (!current.url) {
        startPage.classList.add('active');
        urlInput.value = '';
      } else {
        startPage.classList.remove('active');
        urlInput.value = current.url;
      }

      updateStarState();
      renderTabs();
    }

    function closeTab(id, event) {
      if (event) event.stopPropagation();
      const idx = tabs.findIndex(t => t.id === id);
      if (idx === -1) return;

      tabs[idx].webview.remove();
      tabs.splice(idx, 1);

      if (tabs.length === 0) {
        createTab();
      } else if (activeTabId === id) {
        const nextTab = tabs[Math.max(0, idx - 1)];
        switchTab(nextTab.id);
      } else {
        renderTabs();
      }
    }

    function navigateActiveTab(rawInput) {
      const targetUrl = formatUrl(rawInput);
      if (!targetUrl) return;
      const current = tabs.find(t => t.id === activeTabId);
      if (!current) return;

      current.url = targetUrl;
      current.webview.src = targetUrl;
      startPage.classList.remove('active');
      current.webview.classList.add('active');
      urlInput.value = targetUrl;
      updateStarState();
    }

    function renderTabs() {
      tabsContainer.innerHTML = '';
      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
        el.onclick = () => switchTab(tab.id);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'tab-title';
        titleSpan.textContent = tab.title;

        const closeBtn = document.createElement('button');
        closeBtn.className = 'tab-close';
        closeBtn.innerHTML = '&times;';
        closeBtn.onclick = (e) => closeTab(tab.id, e);

        el.appendChild(titleSpan);
        el.appendChild(closeBtn);
        tabsContainer.appendChild(el);
      });
    }

    function updateStarState() {
      const current = tabs.find(t => t.id === activeTabId);
      if (!current || !current.url) {
        btnStar.classList.remove('saved');
        btnStar.innerHTML = '&#9734;';
        return;
      }
      const exists = bookmarks.some(b => b.url === current.url);
      btnStar.classList.toggle('saved', exists);
      btnStar.innerHTML = exists ? '&#9733;' : '&#9734;';
    }

    function renderBookmarks() {
      bookmarksBar.innerHTML = '';
      if (bookmarks.length === 0) {
        const emptyHint = document.createElement('span');
        emptyHint.style.fontSize = '11.5px';
        emptyHint.style.color = '#80868b';
        emptyHint.textContent = 'المفضلة فارغة — اضغط على النجمة لحفظ أي موقع';
        bookmarksBar.appendChild(emptyHint);
        return;
      }
      bookmarks.forEach((bm, index) => {
        const chip = document.createElement('div');
        chip.className = 'bookmark-chip';
        chip.textContent = bm.title || bm.url;
        chip.onclick = () => navigateActiveTab(bm.url);
        chip.oncontextmenu = (e) => {
          e.preventDefault();
          bookmarks.splice(index, 1);
          localStorage.setItem('xtra_bookmarks', JSON.stringify(bookmarks));
          renderBookmarks();
          updateStarState();
        };
        bookmarksBar.appendChild(chip);
      });
    }

    function addToHistory(title, url) {
      if (!url || url === 'about:blank') return;
      historyItems.unshift({ title: title || url, url, time: new Date().toLocaleTimeString() });
      if (historyItems.length > 100) historyItems.pop();
      localStorage.setItem('xtra_history', JSON.stringify(historyItems));
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = '';
      if (historyItems.length === 0) {
        historyList.innerHTML = '<div style="color:#80868b;font-size:12px;text-align:center;margin-top:20px;">لا يوجد سجل تصفح بعد</div>';
        return;
      }
      historyItems.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<div><strong>${item.title}</strong></div><div class="history-url">${item.url}</div>`;
        div.onclick = () => {
          navigateActiveTab(item.url);
          historyPanel.classList.remove('open');
        };
        historyList.appendChild(div);
      });
    }

    // أحداث الأزرار
    document.getElementById('add-tab-btn').onclick = () => createTab();

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigateActiveTab(urlInput.value);
    });

    document.getElementById('start-search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('start-search-input').value;
      navigateActiveTab(q);
      document.getElementById('start-search-input').value = '';
    });

    document.getElementById('btn-back').onclick = () => {
      const current = tabs.find(t => t.id === activeTabId);
      if (current && current.webview.canGoBack()) current.webview.goBack();
    };

    document.getElementById('btn-forward').onclick = () => {
      const current = tabs.find(t => t.id === activeTabId);
      if (current && current.webview.canGoForward()) current.webview.goForward();
    };

    document.getElementById('btn-reload').onclick = () => {
      const current = tabs.find(t => t.id === activeTabId);
      if (current && current.url) current.webview.reload();
    };

    document.getElementById('btn-home').onclick = () => {
      const current = tabs.find(t => t.id === activeTabId);
      if (!current) return;
      current.url = '';
      current.title = 'تبويب جديد';
      current.webview.classList.remove('active');
      startPage.classList.add('active');
      urlInput.value = '';
      updateStarState();
      renderTabs();
    };

    btnStar.onclick = () => {
      const current = tabs.find(t => t.id === activeTabId);
      if (!current || !current.url) return;
      const idx = bookmarks.findIndex(b => b.url === current.url);
      if (idx > -1) {
        bookmarks.splice(idx, 1);
      } else {
        bookmarks.push({ title: current.title, url: current.url });
      }
      localStorage.setItem('xtra_bookmarks', JSON.stringify(bookmarks));
      renderBookmarks();
      updateStarState();
    };

    document.getElementById('btn-toggle-bookmarks').onclick = () => {
      bookmarksBar.classList.toggle('hidden');
    };

    document.getElementById('btn-history').onclick = () => {
      renderHistory();
      historyPanel.classList.toggle('open');
    };

    document.getElementById('btn-close-history').onclick = () => {
      historyPanel.classList.remove('open');
    };

    document.getElementById('btn-clear-history').onclick = () => {
      historyItems = [];
      localStorage.removeItem('xtra_history');
      renderHistory();
    };

    // تشغيل أول تبويب عند الفتح
    renderBookmarks();
    createTab();
  </script>
</body>
</html>
